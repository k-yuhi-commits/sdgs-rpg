<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDGs RPG ゆるキャラ本格版</title>
<style>
:root{--ink:#3a332b;--paper:#fff9ea;--panel:#fffdf4;--line:#8f765b;--sky:#a9dcf3;--grass:#cfe8a5;--ok:#62b66c;--ng:#e56f65;--gold:#e9b949;--blue:#5ca8d9}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(#a9dcf3 0 34%,#dcebc2 34% 100%);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink)}
.wrap{max-width:1180px;margin:auto;padding:14px}
.panel{background:rgba(255,253,244,.97);border:3px solid var(--line);border-radius:22px;box-shadow:0 8px 0 rgba(96,73,48,.18);padding:16px;margin-top:14px}
.header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap} .logo{font-size:clamp(32px,5vw,56px);font-weight:1000;letter-spacing:.03em}
.small{font-size:13px;color:#716454} .hidden{display:none!important}
.chargrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px} .char{border:3px solid var(--line);border-radius:20px;padding:14px;background:#fff8e8;cursor:pointer;text-align:center} .char:hover{transform:translateY(-2px)} .char h3{margin:5px 0} .trait{font-size:13px;line-height:1.5}
.blob{width:120px;height:120px;margin:auto;display:block}
.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:8px} .hudbox{background:#fff7df;border:2px solid #b39b7c;border-radius:14px;padding:9px;text-align:center} .hudbox b{display:block;font-size:20px}
.expbar,.hpbar,.bossbar{height:12px;background:#e5d7bd;border:2px solid #8f765b;border-radius:999px;overflow:hidden} .expbar span{display:block;height:100%;background:#69b5df} .hpbar span{display:block;height:100%;background:#6fc271} .bossbar span{display:block;height:100%;background:#e76f51}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px} .stage{border:3px solid #8f765b;border-radius:18px;background:#fff7dc;min-height:120px;padding:10px;cursor:pointer;text-align:left;position:relative} .stage:hover{transform:translateY(-2px)} .stage.lock{opacity:.4;cursor:not-allowed;transform:none} .stage.clear{outline:4px solid #8bcf8e} .stage.boss{background:#f2ddf2} .stage.final{background:#e8e0f8} .stage .num{font-size:12px;font-weight:800} .stage .icon{font-size:28px} .stage .name{font-size:12px;font-weight:800;line-height:1.3} .stamp{position:absolute;right:8px;top:6px;font-size:20px}
.inv{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0} .item{background:#fff0c6;border:2px solid #ad8c5c;border-radius:999px;padding:7px 10px;font-size:12px}
.battlegrid{display:grid;grid-template-columns:1fr 1.2fr;gap:14px} .scene{background:linear-gradient(#c8e8f5 0 48%,#bfe39b 48%);border:3px solid var(--line);border-radius:20px;padding:14px;min-height:430px;position:relative;overflow:hidden}
.enemywrap{text-align:center;margin-top:20px} .enemyname{font-size:19px;font-weight:900} .playerwrap{position:absolute;left:18px;bottom:18px;display:flex;align-items:flex-end;gap:10px} .playerwrap .blob{width:96px;height:96px;margin:0}
.qpanel{border:3px solid var(--line);border-radius:20px;background:#fffdf4;padding:14px} .q{font-size:22px;font-weight:900;line-height:1.5;margin-bottom:12px} .choices{display:grid;gap:9px}
.choice{border:2px solid #b39b7c;border-radius:12px;background:#fffaf0;padding:12px;text-align:left;font-size:16px;cursor:pointer} .choice:hover{background:#fff1c9} .choice.correct{background:#dff4df;border-color:#62b66c} .choice.wrong{background:#f9dddd;border-color:#e56f65}
.feedback{display:none;margin-top:10px;padding:12px;border-radius:12px} .feedback.ok{display:block;background:#e5f5e6} .feedback.ng{display:block;background:#f9e2e2}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px} button.main,button.sub{border:3px solid #795f43;border-radius:12px;padding:10px 15px;font-weight:900;cursor:pointer} button.main{background:#8bcf8e} button.sub{background:#f4e4bb}
.result{text-align:center} .big{font-size:56px;font-weight:1000} .legend{font-size:12px;color:#716454}
.goalstrip{display:grid;grid-template-columns:repeat(17,1fr);gap:3px;margin-top:12px} .goalmini{color:white;border-radius:6px;padding:5px 2px;text-align:center;font-size:10px;min-height:52px} .goalmini b{display:block;font-size:13px}
@media(max-width:760px){.hud{grid-template-columns:repeat(2,1fr)}.battlegrid{grid-template-columns:1fr}.scene{min-height:330px}.goalstrip{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <div><div class="logo">🌱 SDGs RPG</div><div class="small">未来をつなぐ、ゆるっと冒険！</div></div>
  <div class="small">データはこのブラウザ内に自動保存されます</div>
</div>

<section id="select" class="panel">
<h2>キャラクターをえらぼう！</h2>
<div class="chargrid">
  <button class="char" onclick="choose('fire')"><div id="char-fire"></div><h3>🔥 炎のゆうしゃ</h3><div class="trait">ボス戦開始時 EXP +50</div></button>
  <button class="char" onclick="choose('water')"><div id="char-water"></div><h3>💧 水のまほうつかい</h3><div class="trait">HP上限 +1</div></button>
  <button class="char" onclick="choose('forest')"><div id="char-forest"></div><h3>🌿 森のまもりびと</h3><div class="trait">装備獲得時 EXP +50</div></button>
</div>
</section>

<section id="map" class="panel hidden">
<div class="hud">
 <div class="hudbox">冒険者<b id="heroName">-</b></div>
 <div class="hudbox">LEVEL<b id="lv">1</b></div>
 <div class="hudbox">EXP<b id="xp">0</b></div>
 <div class="hudbox">HP<b id="hp">3/3</b></div>
 <div class="hudbox">CLEAR<b id="clear">0/17</b></div>
</div>
<div class="expbar"><span id="xpbar"></span></div>
<div id="inv" class="inv"></div>
<h3>ワールドマップ</h3>
<div id="mapgrid" class="mapgrid"></div>
<div class="actions"><span class="small">GOAL4・8・12・16のあとに中ボス、GOAL17のあとにラスボス。</span><button class="sub" onclick="resetGame()">最初から</button></div>
<div id="goalstrip" class="goalstrip"></div>
</section>

<section id="battle" class="panel hidden">
<div class="battlegrid">
 <div class="scene">
   <div class="enemywrap">
     <div class="enemyname" id="enemyName"></div>
     <div class="bossbar hidden" id="bossBarWrap"><span id="bossBar"></span></div>
     <div id="enemySvg"></div>
   </div>
   <div class="playerwrap"><div id="playerSvg"></div><div><b id="playerName"></b><div class="hpbar" style="width:150px"><span id="hpbar"></span></div><div class="small" id="battleHp"></div></div></div>
 </div>
 <div class="qpanel">
   <div class="small" id="label"></div>
   <div class="small" id="progressText"></div>
   <div class="q" id="question"></div>
   <div class="choices" id="choices"></div>
   <div id="feedback" class="feedback"></div>
   <div class="actions">
      <button class="sub" onclick="backMap()">マップへ戻る</button>
      <button id="hintBtn" class="sub hidden" onclick="useHint()">📘 2択ヒント</button>
      <button id="shieldBtn" class="sub hidden" onclick="useShield()">🛡️ シールド</button>
      <button id="nextBtn" class="main hidden" onclick="nextBattle()">次へ</button>
   </div>
 </div>
</div>
</section>

<section id="ending" class="panel hidden result">
<div style="font-size:72px">🏆</div><h1>世界の未来を守った！</h1>
<div class="big" id="finalLevel"></div><p id="summary"></p>
<p>一番気になったSDGs目標を1つ選んで、「なぜ気になったか」を友達と話してみよう。</p>
<button class="main" onclick="resetGame()">もう一度プレイ</button>
</section>
</div>
<script>
const Q=[{"goal": 1, "q": "目標1「貧困をなくそう」が目指すこととして最も近いものは？", "choices": ["誰もが必要な生活を送れる社会にする", "世界中の税金を同じにする", "全員の収入を同じにする", "現金をなくす"], "a": 0, "exp": "貧困は収入だけでなく、住まい・教育・医療など生活全体に関わります。", "difficulty": 1}, {"goal": 1, "q": "「相対的貧困」とは？", "choices": ["社会の中で標準的な生活を送ることが難しい状態", "砂漠で暮らすこと", "外国に行けないこと", "現金を持っていないこと"], "a": 0, "exp": "その社会の一般的な生活水準と比べて、必要な生活が難しい状態を指します。", "difficulty": 2}, {"goal": 1, "q": "貧困の連鎖を断つ方法として特に重要なのは？", "choices": ["教育や就労の機会を広げる", "食品を大量に廃棄する", "公共サービスを減らす", "災害支援をやめる"], "a": 0, "exp": "教育と仕事の機会は、長期的な貧困対策の重要な柱です。", "difficulty": 3}, {"goal": 2, "q": "目標2「飢餓をゼロに」に含まれる考えは？", "choices": ["安全で栄養ある食料を誰もが得られること", "世界中で同じ料理を食べること", "肉を禁止すること", "農業をなくすこと"], "a": 0, "exp": "飢餓、栄養不足、持続可能な農業が中心テーマです。", "difficulty": 1}, {"goal": 2, "q": "食品ロスを減らす行動は？", "choices": ["食べ切れる量を選ぶ", "期限が近い食品を必ず捨てる", "料理を多く作りすぎる", "食べ残しを増やす"], "a": 0, "exp": "食べ切れる量を選ぶことは身近な食品ロス対策です。", "difficulty": 2}, {"goal": 2, "q": "持続可能な農業に近いのは？", "choices": ["土や水を守りながら生産する", "毎年土地を使い捨てる", "農薬を無制限に使う", "農地をすべて住宅にする"], "a": 0, "exp": "将来も農業を続けられるように土・水・生態系を守ることが重要です。", "difficulty": 3}, {"goal": 3, "q": "目標3に最も関係するのは？", "choices": ["予防接種や医療を受けられる環境", "病院を減らすこと", "睡眠時間を削ること", "感染症情報を隠すこと"], "a": 0, "exp": "病気の予防、医療へのアクセス、心身の健康が目標3に含まれます。", "difficulty": 1}, {"goal": 3, "q": "健康を守る基本として適切なのは？", "choices": ["睡眠・運動・バランスのよい食事", "毎日徹夜", "水分を取らない", "朝食を必ず抜く"], "a": 0, "exp": "生活習慣を整えることは健康維持の基本です。", "difficulty": 2}, {"goal": 3, "q": "『福祉』に最も近い考えは？", "choices": ["誰もが安心して生活できるよう支えること", "競争に負けた人を放置すること", "高齢者だけを支えること", "病気の人を社会から遠ざけること"], "a": 0, "exp": "福祉は年齢や状況にかかわらず、安心して暮らすための支援を含みます。", "difficulty": 3}, {"goal": 4, "q": "目標4が目指すものは？", "choices": ["誰もが質の高い教育を受けられること", "テストをなくすこと", "世界中で同じ教科書を使うこと", "学校を減らすこと"], "a": 0, "exp": "教育の機会と質の両方が大切です。", "difficulty": 1}, {"goal": 4, "q": "教育格差を小さくする取り組みは？", "choices": ["学習機会や教材へのアクセスを広げる", "授業料を大幅に上げる", "学校数を減らす", "一部の人だけに端末を配る"], "a": 0, "exp": "家庭の経済状況や地域に左右されず学べる環境が重要です。", "difficulty": 2}, {"goal": 4, "q": "生涯学習とは？", "choices": ["年齢に関係なく学び続けること", "学校に }
function startStage(g){mode='stage';curGoal=g;answered=false;s.hp=maxhp();shieldArmed=false;hintUsed=false;curQ=shuffleQuestion(pickQuestion(g,1));save();openBattle('GOAL '+g,N[g],false,'');}
function startBoss(k,total){mode='boss';bossKey=k;bossTotal=total;bossIndex=0;bossCorrect=0;bossHP=total;shieldArmed=false;hintUsed=false;s.hp=maxhp()+(k==='final'&&s.items.includes('crystal')?1:0);if(s.char==='fire')s.xp+=50;save();nextBossQuestion();}
function nextBossQuestion(){bossIndex++;answered=false;hintUsed=false;curQ=shuffleQuestion(pickQuestion(null,bossKey==='final'?2:1));openBattle(bossKey==='final'?'FINAL BOSS':'BOSS BATTLE',bossKey==='final'?'カオス・オブ・SDGs':'ゆるモンスター '+bossKey.slice(1),true,`${bossIndex} / ${bossTotal} 問`);}
function openBattle(label,name,isBoss,prog){
 document.getElementById('map').classList.add('hidden');document.getElementById('battle').classList.remove('hidden');document.getElementById('ending').classList.add('hidden');
 document.getElementById('label').textContent=label;document.getElementById('progressText').textContent=prog;document.getElementById('question').textContent=curQ.q;document.getElementById('enemyName').textContent=name;document.getElementById('playerName').textContent=CH[s.char].name;document.getElementById('battleHp').textContent='HP '+s.hp+' / '+maxhp();document.getElementById('hpbar').style.width=(Math.min(1,s.hp/maxhp())*100)+'%';
 document.getElementById('playerSvg').innerHTML=blobSVG(CH[s.char].color,'happy',s.char==='fire'?'flame':s.char==='water'?'drop':'leaf');
 let enemyColor=isBoss?(bossKey==='final'?'#5b526d':'#b58ac7'):C[curGoal]||'#ef9a9a';document.getElementById('enemySvg').innerHTML=blobSVG(enemyColor,isBoss?'angry':'happy','none',true);
 document.getElementById('bossBarWrap').classList.toggle('hidden',!isBoss);if(isBoss)document.getElementById('bossBar').style.width=(bossHP/bossTotal*100)+'%';
 document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='';document.getElementById('nextBtn').classList.add('hidden');document.getElementById('hintBtn').classList.toggle('hidden',!s.items.includes('book')||hintUsed);document.getElementById('shieldBtn').classList.toggle('hidden',!s.items.includes('shield')||shieldArmed);
 const c=document.getElementById('choices');c.innerHTML='';curQ.choices.forEach((x,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'　'+x;b.onclick=()=>answer(i,b);c.appendChild(b);});
}
function useHint(){if(hintUsed||answered)return;hintUsed=true;const wrong=[0,1,2,3].filter(i=>i!==curQ.a).sort(()=>Math.random()-.5);wrong.slice(0,2).forEach(i=>{const b=document.querySelectorAll('.choice')[i];b.disabled=true;b.style.opacity=.35});document.getElementById('hintBtn').classList.add('hidden');}
function useShield(){if(shieldArmed||answered)return;shieldArmed=true;document.getElementById('shieldBtn').classList.add('hidden');alert('エコのたてを構えた！ 次の不正解ダメージを1回無効にします。');}
function answer(i,b){if(answered)return;answered=true;s.attempts++;const all=[...document.querySelectorAll('.choice')],fb=document.getElementById('feedback');all[curQ.a].classList.add('correct');
 if(i===curQ.a){s.correct++;s.xp+=100;if(mode==='boss'){bossCorrect++;bossHP=Math.max(0,bossHP-1);}fb.className='feedback ok';fb.innerHTML='<b>正解！ EXP +100</b><br>'+curQ.exp;}
 else{b.classList.add('wrong');if(shieldArmed){shieldArmed=false;fb.className='feedback ng';fb.innerHTML='<b>🛡️ シールド発動！ ダメージなし</b><br>正解：'+curQ.choices[curQ.a]+'<br>'+curQ.exp;}else{s.hp=Math.max(0,s.hp-1);fb.className='feedback ng';fb.innerHTML='<b>おしい！ HP -1</b><br>正解：'+curQ.choices[curQ.a]+'<br>'+curQ.exp;}}
 save();document.getElementById('battleHp').textContent='HP '+s.hp+' / '+maxhp();document.getElementById('hpbar').style.width=(Math.min(1,s.hp/maxhp())*100)+'%';document.getElementById('nextBtn').classList.remove('hidden');}
function nextBattle(){
 if(mode==='stage'){if(!s.cleared.includes(curGoal))s.cleared.push(curGoal);const thresholds=[3,7,11,15],idx=thresholds.indexOf(s.cleared.length);if(idx>=0&&!s.items.includes(EQ[idx].id)){s.items.push(EQ[idx].id);if(s.char==='forest')s.xp+=50;alert('装備ゲット！ '+EQ[idx].name+'\n'+EQ[idx].effect);}save();backMap();}
 else{if(bossIndex<bossTotal)nextBossQuestion();else{const need=bossKey==='final'?4:2;if(bossCorrect>=need){if(!s.bosses.includes(bossKey))s.bosses.push(bossKey);let bonus=200+(s.items.includes('boots')&&bossKey!=='final'?50:0);s.xp+=bonus;alert('ボス撃破！ EXP +'+bonus);save();if(bossKey==='final')finish();else backMap();}else{alert('ボスに敗北… '+bossTotal+'問中'+need+'問以上正解で勝利！');backMap();}}}
function backMap(){document.getElementById('battle').classList.add('hidden');document.getElementById('ending').classList.add('hidden');document.getElementById('map').classList.remove('hidden');renderMap();}
function finish(){document.getElementById('battle').classList.add('hidden');document.getElementById('map').classList.add('hidden');document.getElementById('ending').classList.remove('hidden');const rate=s.attempts?Math.round(s.correct/s.attempts*100):0;document.getElementById('finalLevel').textContent='LEVEL '+level();document.getElementById('summary').textContent=CH[s.char].name+'｜正解率 '+rate+'%｜EXP '+s.xp;}
function resetGame(){if(!confirm('冒険データをすべて消して最初から始めますか？'))return;localStorage.removeItem('sdgsCuteRPG');location.reload();}
renderChars();if(s.char){document.getElementById('select').classList.add('hidden');document.getElementById('map').classList.remove('hidden');renderMap();}
</script>
</body>
</html>
